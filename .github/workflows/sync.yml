name: Sync Vibes pins

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add new public pins
        run: python3 scripts/merge_public.py

      - name: Commit pins.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pins.json
          if git diff --cached --quiet -- pins.json; then
            echo "No pin changes."
            exit 0
          fi
          git commit -m "Update pins from the Vibes board"
          git push origin "HEAD:${GITHUB_REF_NAME}"
